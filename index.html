<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГДЗ.ua - Готові домашні завдання</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="logo-container">
            <img src="Gemini_Generated_Image_sy8az4sy8az4sy8a.jpg" alt="ГДЗ.ua" class="logo">
            <h1>ГДЗ.ua</h1>
        </div>
    </header>

    <main class="container">
        <!-- Крок 1: Вибір класу -->
        <section id="step-classes" class="step active">
            <h2>Оберіть свій клас</h2>
            <div class="grid-container classes-grid">
                <!-- Генеруємо класи від 1 до 11 -->
                <button class="grid-item" onclick="selectClass(1)">1 клас</button>
                <button class="grid-item" onclick="selectClass(2)">2 клас</button>
                <button class="grid-item" onclick="selectClass(3)">3 клас</button>
                <button class="grid-item" onclick="selectClass(4)">4 клас</button>
                <button class="grid-item" onclick="selectClass(5)">5 клас</button>
                <button class="grid-item" onclick="selectClass(6)">6 клас</button>
                <button class="grid-item" onclick="selectClass(7)">7 клас</button>
                <button class="grid-item" onclick="selectClass(8)">8 клас</button>
                <button class="grid-item active-class" onclick="selectClass(9)">9 клас</button>
                <button class="grid-item" onclick="selectClass(10)">10 клас</button>
                <button class="grid-item" onclick="selectClass(11)">11 клас</button>
            </div>
        </section>

        <!-- Крок 2: Вибір предмета -->
        <section id="step-subjects" class="step">
            <button class="back-btn" onclick="goBack('step-classes')">⬅ Назад до класів</button>
            <h2>Предмети (9 клас)</h2>
            <div class="grid-container subjects-grid">
                <button class="grid-item subject" onclick="selectSubject('Алгебра')">Алгебра</button>
                <button class="grid-item subject" onclick="selectSubject('Геометрія')">Геометрія</button>
                <button class="grid-item subject" onclick="selectSubject('Укр. мова')">Укр. мова</button>
                <button class="grid-item subject" onclick="selectSubject('Англійська')">Англійська</button>
                <button class="grid-item subject" onclick="selectSubject('Фізика')">Фізика</button>
                <button class="grid-item subject" onclick="selectSubject('Хімія')">Хімія</button>
            </div>
        </section>

        <!-- Крок 3: Вибір підручника -->
        <section id="step-books" class="step">
            <button class="back-btn" onclick="goBack('step-subjects')">⬅ Назад до предметів</button>
            <h2 id="selected-subject-title">Оберіть підручник</h2>
            <div class="books-container">
                <!-- Приклад карток підручників -->
                <div class="book-card">
                    <div class="book-cover mock-cover">Підручник 1</div>
                    <div class="book-info">
                        <h3>Автор 1</h3>
                        <p>2022 рік</p>
                    </div>
                </div>
                <div class="book-card">
                    <div class="book-cover mock-cover">Підручник 2</div>
                    <div class="book-info">
                        <h3>Автор 2</h3>
                        <p>2023 рік</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Модальне вікно (Повідомлення про недоступність) -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Увага!</h3>
            <p>Цей клас тимчасово недоступний. Зараз працює лише 9 клас, матеріали для інших класів додаються!</p>
            <button class="close-btn" onclick="closeModal()">Зрозуміло</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
