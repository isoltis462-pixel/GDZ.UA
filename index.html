<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГДЗ.ua - Готові домашні завдання</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="admin.html" class="admin-link">⚙️ Адмінка</a>
    </header>

    <main class="main-container">
        <!-- Ліва частина з логотипом -->
        <div class="logo-section">
            <div class="logo-circle">
                <div class="trident">🔱</div>
                <div class="logo-text">ГДЗ.ua</div>
                <div class="book-icon">📖</div>
            </div>
        </div>

        <!-- Права частина з вибором класів -->
        <div class="content-section">
            <h1 class="main-title">Оберіть клас</h1>
            
            <div class="classes-grid" id="classesGrid">
                <!-- Кнопки класів 1-11 генеруються скріптом -->
            </div>

            <!-- Блок відображення вправ вибраного класу -->
            <div id="exercisesContainer" class="exercises-container" style="display: none;">
                <h2 id="selectedClassHeader">Вправи</h2>
                <div id="exercisesList"></div>
            </div>
        </div>
    </main>

    <!-- Модальне вікно (з виправленою кнопкою "Зрозуміло") -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Увага!</h3>
            <p id="modalText">Цей клас тимчасово недоступний. Зараз працює лише 9 клас, матеріали для інших класів додаються!</p>
            <button type="button" class="btn-modal" onclick="closeModal()">Зрозуміло</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
