<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ГДЗ ОНЛАЙН — Готові домашні завдання</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-light: #2563eb;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body.dark-theme {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 2rem;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            position: relative;
        }

        /* HEADER */
        header {
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .avatar-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--primary-light);
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        /* SEARCH BAR */
        .search-section {
            max-width: 1100px;
            margin: 1rem auto 0;
            padding: 0 1rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 25px;
            background-color: var(--surface);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            box-shadow: var(--shadow);
            transition: 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* MAIN CONTENT & BREADCRUMBS */
        main {
            max-width: 1100px;
            margin: 1rem auto;
            padding: 0 1rem;
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            color: var(--primary-light);
            cursor: pointer;
            font-weight: 600;
        }

        .breadcrumb-item:hover {
            text-decoration: underline;
        }

        .breadcrumb-separator {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* STEP 1: CLASSES GRID */
        .grid-classes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.75rem;
        }

        .class-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem 0.5rem;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text);
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .class-card span {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .class-card:active, .class-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        /* STEP 2: SUBJECTS GRID */
        .grid-subjects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .subject-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }

        .subject-card:active, .subject-card:hover {
            border-color: var(--primary-light);
            background: rgba(37, 99, 235, 0.05);
            color: var(--primary-light);
        }

        /* STEP 3: BOOKS GRID */
        .grid-books {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .grid-books {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }
        }

        .book-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .book-card:active {
            transform: scale(0.98);
        }

        .book-cover {
            aspect-ratio: 3/4;
            width: 100%;
            background: #e2e8f0;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
            padding: 0.5rem;
        }

        .book-info {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .book-title {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .book-author {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* MODALS */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        @media (min-width: 640px) {
            .modal {
                align-items: center;
                padding: 1rem;
            }
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @media (min-width: 640px) {
            .modal-content {
                border-radius: var(--radius-lg);
                transform: translateY(20px);
            }
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .close-btn {
            background: var(--bg);
            border: none;
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .task-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.6rem 0.25rem;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
        }

        .task-btn.active {
            background: var(--primary-light);
            color: white;
            border-color: var(--primary-light);
        }

        .solution-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .solution-img {
            max-width: 100%;
            border-radius: var(--radius-sm);
            margin-top: 0.5rem;
            box-shadow: var(--shadow);
        }

        .empty-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* SECRET ADMIN BUTTON (ПК ТІЛЬКИ, ЗЛІВА ЗНИЗУ) */
        .admin-pc-btn {
            display: none;
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: #ef4444;
            color: white;
            font-weight: 900;
            font-size: 1.1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            z-index: 999;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .admin-pc-btn:hover {
            transform: scale(1.15);
        }

        /* Тільки для ПК (екрани більше 1024px) */
        @media (min-width: 1025px) {
            .admin-pc-btn {
                display: flex;
            }
        }

        /* ADMIN MODAL FORM STYLES */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .btn-submit {
            background: var(--primary-light);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }

        .task-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .admin-book-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .del-book-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-group" onclick="resetToStep(1)">
                <img src="Знімок екрана 2026-09-18 140926.jpg" alt="ГДЗ ОНЛАЙН" class="avatar-img" onerror="this.src='https://via.placeholder.com/44?text=ГДЗ'">
                <div class="logo-text">
                    <span class="logo-title">ГДЗ ОНЛАЙН</span>
                    <span class="logo-subtitle">Готові домашні завдання</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="Змінити тему">🌙</button>
            </div>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Пошук за предметом або автором...">
        </div>
    </div>

    <main>
        <div class="breadcrumbs" id="breadcrumbs">
            <span class="breadcrumb-item" onclick="resetToStep(1)">Головна (Класи)</span>
        </div>

        <div id="viewContainer">
            <!-- ДИНАМІЧНИЙ КОНТЕНТ -->
        </div>
    </main>

    <!-- СЕКРЕТНА ЧЕРВОНА КНОПКА "А" (Тільки ПК, знизу зліва) -->
    <button class="admin-pc-btn" onclick="openAdminPrompt()" title="Адмін-панель">А</button>

    <!-- МОДАЛЬНЕ ВІКНО РОЗВ'ЯЗКІВ -->
    <div class="modal" id="solutionModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalBookTitle">Підручник</div>
                <button class="close-btn" onclick="closeModal('solutionModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="section-title" id="unitTypeTitle">Оберіть завдання</div>
                <div class="tasks-grid" id="tasksGrid"></div>
                <div class="solution-box" id="solutionBox" style="display: none;">
                    <h4 id="selectedTaskName">Завдання №1</h4>
                    <div id="solutionImageContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО АДМІНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title">⚙️ Адмін-панель</div>
                <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
            </div>
            <div class="modal-body">
                <form id="addBookForm">
                    <div class="form-group">
                        <label>Клас:</label>
                        <select id="classSelect" required>
                            <option value="1">1 клас</option>
                            <option value="2">2 клас</option>
                            <option value="3">3 клас</option>
                            <option value="4">4 клас</option>
                            <option value="5">5 клас</option>
                            <option value="6">6 клас</option>
                            <option value="7">7 клас</option>
                            <option value="8">8 клас</option>
                            <option value="9">9 клас</option>
                            <option value="10">10 клас</option>
                            <option value="11">11 клас</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Предмет:</label>
                        <input type="text" id="subjectInput" placeholder="Математика, Англійська мова..." required>
                    </div>

                    <div class="form-group">
                        <label>Назва підручника:</label>
                        <input type="text" id="titleInput" placeholder="напр. Алгебра 8 клас" required>
                    </div>

                    <div class="form-group">
                        <label>Автор(и):</label>
                        <input type="text" id="authorInput" placeholder="А.Г. Мерзляк" required>
                    </div>

                    <div class="form-group">
                        <label>Обкладинка (фото):</label>
                        <input type="file" id="coverFileInput" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>Тип завдань:</label>
                        <select id="unitTypeSelect">
                            <option value="Номер">Номери (№)</option>
                            <option value="Вправа">Вправи</option>
                            <option value="Юніт">Юніти (Unit)</option>
                            <option value="Завдання">Завдання</option>
                            <option value="Параграф">Параграфи</option>
                            <option value="Сторінка">Сторінки (Page)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Додати вправи та фото розв'язків:</label>
                        <div id="adminTasksContainer"></div>
                        <button type="button" onclick="addAdminTaskRow()" style="margin-top:0.4rem; padding:0.4rem 0.8rem; cursor:pointer;">+ Додати вправу</button>
                    </div>

                    <button type="submit" class="btn-submit">Зберегти підручник</button>
                </form>

                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">
                <h4>Керування створеними підручниками</h4>
                <div id="adminBooksList" style="margin-top: 0.5rem;"></div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_SUBJECTS = {
            1: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова"],
            2: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова"],
            3: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова", "Інформатика"],
            4: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова", "Інформатика"],
            5: ["Математика", "Українська мова", "Українська література", "Англійська мова", "Зарубіжна література", "Вступ до історії"],
            6: ["Математика", "Українська мова", "Англійська мова", "Біологія", "Географія", "Історія України"],
            7: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова"],
            8: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Географія", "Історія України"],
            9: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Правознавство"],
            10: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Історія"],
            11: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Історія"]
        };

        function getBooksData() {
            const data = localStorage.getItem('gdz_books_data');
            return data ? JSON.parse(data) : [];
        }

        function saveBooksData(data) {
            localStorage.setItem('gdz_books_data', JSON.stringify(data));
        }

        let state = {
            step: 1,
            selectedClass: null,
            selectedSubject: null,
            searchQuery: ''
        };

        const viewContainer = document.getElementById('viewContainer');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const searchInput = document.getElementById('searchInput');

        function init() {
            renderView();
            setupSearch();
            setupTheme();
        }

        function renderView() {
            if (state.searchQuery.length > 0) {
                renderSearchResults();
                return;
            }

            updateBreadcrumbs();

            if (state.step === 1) {
                renderClasses();
            } else if (state.step === 2) {
                renderSubjects();
            } else if (state.step === 3) {
                renderBooks();
            }
        }

        function renderClasses() {
            let html = `
                <div class="section-title">Оберіть клас</div>
                <div class="grid-classes">
            `;
            for (let i = 1; i <= 11; i++) {
                html += `
                    <div class="class-card" onclick="selectClass(${i})">
                        ${i} клас
                        <span>підручники</span>
                    </div>
                `;
            }
            html += `</div>`;
            viewContainer.innerHTML = html;
        }

        function selectClass(cls) {
            state.selectedClass = cls;
            state.step = 2;
            renderView();
        }

        function renderSubjects() {
            const subjects = DEFAULT_SUBJECTS[state.selectedClass] || [];
            let html = `
                <div class="section-title">Оберіть предмет (${state.selectedClass} клас)</div>
                <div class="grid-subjects">
            `;
            
            subjects.forEach(subj => {
                html += `
                    <div class="subject-card" onclick="selectSubject('${subj}')">
                        ${subj}
                    </div>
                `;
            });

            html += `</div>`;
            viewContainer.innerHTML = html;
        }

        function selectSubject(subj) {
            state.selectedSubject = subj;
            state.step = 3;
            renderView();
        }

        function renderBooks() {
            const allBooks = getBooksData();
            const filteredBooks = allBooks.filter(b => 
                Number(b.classNum) === Number(state.selectedClass) && 
                b.subject.toLowerCase() === state.selectedSubject.toLowerCase()
            );

            let html = `<div class="section-title">${state.selectedSubject} (${state.selectedClass} клас)</div>`;

            if (filteredBooks.length === 0) {
                html += `
                    <div class="empty-msg">
                        Наразі немає доданих підручників для цього предмета.
                    </div>
                `;
            } else {
                html += `<div class="grid-books">`;
                filteredBooks.forEach(book => {
                    html += `
                        <div class="book-card" onclick="openBookModal('${book.id}')">
                            ${book.cover ? `<img src="${book.cover}" class="book-cover">` : `<div class="book-cover">${book.title}</div>`}
                            <div class="book-info">
                                <div class="book-title">${book.title}</div>
                                <div class="book-author">${book.author}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            viewContainer.innerHTML = html;
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.toLowerCase().trim();
                renderView();
            });
        }

        function renderSearchResults() {
            const allBooks = getBooksData();
            const results = allBooks.filter(b => 
                b.title.toLowerCase().includes(state.searchQuery) ||
                b.author.toLowerCase().includes(state.searchQuery) ||
                b.subject.toLowerCase().includes(state.searchQuery)
            );

            breadcrumbs.innerHTML = `<span class="breadcrumb-item" onclick="clearSearch()">Результати пошуку ("${state.searchQuery}")</span>`;

            if (results.length === 0) {
                viewContainer.innerHTML = `<div class="empty-msg">Нічого не знайдено</div>`;
                return;
            }

            let html = `<div class="grid-books">`;
            results.forEach(book => {
                html += `
                    <div class="book-card" onclick="openBookModal('${book.id}')">
                        ${book.cover ? `<img src="${book.cover}" class="book-cover">` : `<div class="book-cover">${book.title}</div>`}
                        <div class="book-info">
                            <div class="book-title">${book.title} (${book.classNum} кл)</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            viewContainer.innerHTML = html;
        }

        function clearSearch() {
            searchInput.value = '';
            state.searchQuery = '';
            renderView();
        }

        function updateBreadcrumbs() {
            let html = `<span class="breadcrumb-item" onclick="resetToStep(1)">Головна</span>`;

            if (state.step >= 2) {
                html += ` <span class="breadcrumb-separator">❯</span> <span class="breadcrumb-item" onclick="resetToStep(2)">${state.selectedClass} клас</span>`;
            }
            if (state.step === 3) {
                html += ` <span class="breadcrumb-separator">❯</span> <span class="breadcrumb-item">${state.selectedSubject}</span>`;
            }

            breadcrumbs.innerHTML = html;
        }

        function resetToStep(step) {
            state.step = step;
            if (step === 1) {
                state.selectedClass = null;
                state.selectedSubject = null;
            } else if (step === 2) {
                state.selectedSubject = null;
            }
            searchInput.value = '';
            state.searchQuery = '';
            renderView();
        }

        // МОДАЛЬНІ ВІКНА
        let currentOpenBook = null;

        function openBookModal(bookId) {
            const allBooks = getBooksData();
            currentOpenBook = allBooks.find(b => b.id === bookId);
            if (!currentOpenBook) return;

            document.getElementById('modalBookTitle').innerText = `${currentOpenBook.title} — ${currentOpenBook.author}`;
            document.getElementById('unitTypeTitle').innerText = `Оберіть ${currentOpenBook.unitType || 'Завдання'}:`;
            
            const tasksGrid = document.getElementById('tasksGrid');
            const solutionBox = document.getElementById('solutionBox');
            solutionBox.style.display = 'none';

            let html = '';
            if (currentOpenBook.tasks && currentOpenBook.tasks.length > 0) {
                currentOpenBook.tasks.forEach((task, index) => {
                    html += `
                        <div class="task-btn" onclick="showSolution(${index}, this)">
                            ${task.name}
                        </div>
                    `;
                });
            } else {
                html = `<div style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">Вправи ще не додані</div>`;
            }

            tasksGrid.innerHTML = html;
            document.getElementById('solutionModal').classList.add('active');
        }

        function showSolution(index, btnEl) {
            document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const task = currentOpenBook.tasks[index];
            const solutionBox = document.getElementById('solutionBox');
            const selectedTaskName = document.getElementById('selectedTaskName');
            const solutionImageContainer = document.getElementById('solutionImageContainer');

            selectedTaskName.innerText = `${currentOpenBook.unitType || 'Завдання'} ${task.name}`;

            if (task.image) {
                solutionImageContainer.innerHTML = `<img src="${task.image}" class="solution-img" alt="Розв'язок">`;
            } else {
                solutionImageContainer.innerHTML = `<p style="padding: 1rem; color: var(--text-muted);">Фото розв'язку відсутнє</p>`;
            }

            solutionBox.style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ПАРОЛЬ ТА АДМІНКА
        function openAdminPrompt() {
            const pass = prompt('Введіть пароль від адмін-панелі:');
            if (pass === '12345678') {
                renderAdminBooks();
                document.getElementById('adminModal').classList.add('active');
            } else if (pass !== null) {
                alert('Невірний пароль!');
            }
        }

        let adminTaskCounter = 0;
        function addAdminTaskRow(name = '', image = '') {
            adminTaskCounter++;
            const container = document.getElementById('adminTasksContainer');
            const div = document.createElement('div');
            div.className = 'task-input-group';
            div.id = `adminTaskRow_${adminTaskCounter}`;

            div.innerHTML = `
                <input type="text" placeholder="№" value="${name}" class="task-name" style="width:70px;" required>
                <input type="file" accept="image/*" class="task-file">
                <button type="button" onclick="this.parentElement.remove()" style="background:#ef4444; color:white; border:none; padding:0.3rem 0.6rem; border-radius:4px; cursor:pointer;">✕</button>
            `;
            container.appendChild(div);
        }

        // За замовчуванням 3 поля в адмінці
        addAdminTaskRow('1');
        addAdminTaskRow('2');
        addAdminTaskRow('3');

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve('');
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('addBookForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const classNum = document.getElementById('classSelect').value;
            const subject = document.getElementById('subjectInput').value.trim();
            const title = document.getElementById('titleInput').value.trim();
            const author = document.getElementById('authorInput').value.trim();
            const unitType = document.getElementById('unitTypeSelect').value;
            const coverFile = document.getElementById('coverFileInput').files[0];

            let coverBase64 = '';
            if (coverFile) {
                coverBase64 = await fileToBase64(coverFile);
            }

            const taskRows = document.querySelectorAll('#adminTasksContainer .task-input-group');
            const tasks = [];

            for (let row of taskRows) {
                const name = row.querySelector('.task-name').value.trim();
                const file = row.querySelector('.task-file').files[0];
                let imgBase64 = '';
                if (file) {
                    imgBase64 = await fileToBase64(file);
                }
                if (name) {
                    tasks.push({ name, image: imgBase64 });
                }
            }

            const newBook = {
                id: 'book_' + Date.now(),
                classNum,
                subject,
                title,
                author,
                unitType,
                cover: coverBase64,
                tasks
            };

            const books = getBooksData();
            books.push(newBook);
            saveBooksData(books);

            alert('Підручник успішно збережено!');
            closeModal('adminModal');
            renderView();
        });

        function renderAdminBooks() {
            const books = getBooksData();
            const container = document.getElementById('adminBooksList');

            if (books.length === 0) {
                container.innerHTML = '<p style="color:gray;">Немає створених підручників</p>';
                return;
            }

            let html = '';
            books.forEach(b => {
                html += `
                    <div class="admin-book-item">
                        <div>
                            <strong>${b.title}</strong> (${b.classNum} кл — ${b.subject})
                        </div>
                        <button class="del-book-btn" onclick="deleteBook('${b.id}')">Видалити</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function deleteBook(id) {
            if (confirm('Видалити цей підручник?')) {
                let books = getBooksData();
                books = books.filter(b => b.id !== id);
                saveBooksData(books);
                renderAdminBooks();
                renderView();
            }
        }

        function setupTheme() {
            const btn = document.getElementById('themeToggle');
            btn.addEventListener('click', () => {
                document.body.classList.toggle('dark-theme');
                btn.innerText = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
            });
        }

        init();
    </script>
</body>
</html>
