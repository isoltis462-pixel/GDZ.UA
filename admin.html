<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГДЗ ОНЛАЙН — Адмін-панель</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-light: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .admin-container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--primary-light);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .btn-submit {
            background: var(--primary-light);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }

        .btn-cancel-edit {
            background: #64748b;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .task-input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            gap: 0.5rem;
        }

        .admin-actions {
            display: flex;
            gap: 0.3rem;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .del-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-section-box {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-top: 1rem;
        }

        .admin-section-title {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }

        .add-subject-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .add-subject-row select, .add-subject-row input {
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
        }

        .add-subject-row button {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>⚙️ Адміністрування сайту</h1>

    <!-- ФОРМА ДОДАВАННЯ/РЕДАГУВАННЯ КНИГ -->
    <form id="addBookForm">
        <h4 style="margin-bottom: 0.5rem;" id="formHeader">Додати підручник</h4>
        <input type="hidden" id="editingBookId" value="">
        
        <div class="form-group">
            <label>Клас:</label>
            <select id="classSelect" required>
                <option value="1">1 клас</option>
                <option value="2">2 клас</option>
                <option value="3">3 клас</option>
                <option value="4">4 клас</option>
                <option value="5">5 клас</option>
                <option value="6">6 клас</option>
                <option value="7">7 клас</option>
                <option value="8">8 клас</option>
                <option value="9">9 клас</option>
                <option value="10">10 клас</option>
                <option value="11">11 клас</option>
            </select>
        </div>

        <div class="form-group">
            <label>Предмет:</label>
            <input type="text" id="subjectInput" placeholder="Математика, Алгебра..." required>
        </div>

        <div class="form-group">
            <label>Назва підручника:</label>
            <input type="text" id="titleInput" placeholder="напр. Алгебра 8 клас" required>
        </div>

        <div class="form-group">
            <label>Автор(и):</label>
            <input type="text" id="authorInput" placeholder="А.Г. Мерзляк" required>
        </div>

        <div class="form-group">
            <label>Обкладинка (фото):</label>
            <input type="file" id="coverFileInput" accept="image/*">
            <small id="coverNotice" style="color: gray; display: block; margin-top: 2px;"></small>
        </div>

        <div class="form-group">
            <label>Тип завдань:</label>
            <select id="unitTypeSelect">
                <option value="Номер">Номери (№)</option>
                <option value="Вправа">Вправи</option>
                <option value="Юніт">Юніти (Unit)</option>
                <option value="Завдання">Завдання</option>
                <option value="Параграф">Параграфи</option>
                <option value="Сторінка">Сторінки (Page)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Вправи та фото розв'язків:</label>
            <div id="adminTasksContainer"></div>
            <button type="button" onclick="addAdminTaskRow()" style="margin-top:0.4rem; padding:0.4rem 0.8rem; cursor:pointer; border-radius: 6px;">+ Додати вправу</button>
        </div>

        <button type="submit" class="btn-submit" id="submitBookBtn">Зберегти підручник</button>
        <button type="button" class="btn-cancel-edit" id="cancelEditBtn" style="display:none;" onclick="resetAdminForm()">Скасувати редагування</button>
    </form>

    <!-- СЕКЦІЯ КЕРУВАННЯ ПРЕДМЕТАМИ -->
    <div class="admin-section-box">
        <div class="admin-section-title">📚 Керування предметами</div>
        <div class="add-subject-row">
            <select id="adminSubjectClassSelect" style="width: 100px;">
                <option value="1">1 кл</option>
                <option value="2">2 кл</option>
                <option value="3">3 кл</option>
                <option value="4">4 кл</option>
                <option value="5">5 кл</option>
                <option value="6">6 кл</option>
                <option value="7">7 кл</option>
                <option value="8" selected>8 кл</option>
                <option value="9">9 кл</option>
                <option value="10">10 кл</option>
                <option value="11">11 кл</option>
            </select>
            <input type="text" id="adminNewSubjectName" placeholder="Назва предмета..." style="flex:1;">
            <button type="button" onclick="window.adminAddSubject()">Додати</button>
        </div>
        <div id="adminSubjectsList"></div>
    </div>

    <!-- СЕКЦІЯ КЕРУВАННЯ ПІДРУЧНИКАМИ -->
    <div class="admin-section-box">
        <div class="admin-section-title">📖 Список усіх підручників</div>
        <div id="adminBooksList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAmCzZAEKq4BMo6eWAN96IawhF95cH1sHM",
        authDomain: "keysbrawl-c4ae6.firebaseapp.com",
        databaseURL: "https://keysbrawl-c4ae6-default-rtdb.firebaseio.com",
        projectId: "keysbrawl-c4ae6",
        storageBucket: "keysbrawl-c4ae6.firebasestorage.app",
        messagingSenderId: "1090859079662",
        appId: "1:1090859079662:web:932bf6463cb0601083a0ff",
        measurementId: "G-PJR0BQBYVM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const DEFAULT_SUBJECTS = {
        1: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова"],
        2: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова"],
        3: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова", "Інформатика"],
        4: ["Математика", "Українська мова", "Я досліджую світ", "Англійська мова", "Інформатика"],
        5: ["Математика", "Українська мова", "Українська література", "Англійська мова", "Зарубіжна література", "Вступ до історії"],
        6: ["Математика", "Українська мова", "Англійська мова", "Біологія", "Географія", "Історія України"],
        7: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова"],
        8: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Географія", "Історія України"],
        9: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Правознавство"],
        10: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Історія"],
        11: ["Алгебра", "Геометрія", "Фізика", "Хімія", "Біологія", "Українська мова", "Англійська мова", "Історія"]
    };

    let booksData = [];
    let customSubjects = {};

    function listenDatabase() {
        onValue(ref(db, 'books'), (snapshot) => {
            const data = snapshot.val();
            booksData = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    booksData.push({ id: key, ...data[key] });
                });
            }
            renderAdminBooks();
        });

        onValue(ref(db, 'customSubjects'), (snapshot) => {
            customSubjects = snapshot.val() || {};
            renderAdminSubjects();
        });
    }

    let adminTaskCounter = 0;
    window.addAdminTaskRow = function(name = '', existingImage = '') {
        adminTaskCounter++;
        const container = document.getElementById('adminTasksContainer');
        const div = document.createElement('div');
        div.className = 'task-input-group';
        div.id = `adminTaskRow_${adminTaskCounter}`;
        div.dataset.existingImage = existingImage;

        div.innerHTML = `
            <input type="text" placeholder="№" value="${name}" class="task-name" style="width:70px;" required>
            <input type="file" accept="image/*" class="task-file">
            ${existingImage ? `<span title="Картинка є" style="font-size:12px; color:green;">✓</span>` : ''}
            <button type="button" onclick="this.parentElement.remove()" style="background:#ef4444; color:white; border:none; padding:0.3rem 0.6rem; border-radius:4px; cursor:pointer;">✕</button>
        `;
        container.appendChild(div);
    }

    window.resetAdminForm = function() {
        document.getElementById('addBookForm').reset();
        document.getElementById('editingBookId').value = '';
        document.getElementById('formHeader').innerText = 'Додати підручник';
        document.getElementById('submitBookBtn').innerText = 'Зберегти підручник';
        document.getElementById('cancelEditBtn').style.display = 'none';
        document.getElementById('coverNotice').innerText = '';
        document.getElementById('adminTasksContainer').innerHTML = '';
        
        window.addAdminTaskRow('1');
        window.addAdminTaskRow('2');
        window.addAdminTaskRow('3');
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve('');
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const editingId = document.getElementById('editingBookId').value;
        const classNum = document.getElementById('classSelect').value;
        const subject = document.getElementById('subjectInput').value.trim();
        const title = document.getElementById('titleInput').value.trim();
        const author = document.getElementById('authorInput').value.trim();
        const unitType = document.getElementById('unitTypeSelect').value;
        const coverFile = document.getElementById('coverFileInput').files[0];

        let existingBook = editingId ? booksData.find(b => b.id === editingId) : null;
        let coverBase64 = existingBook ? existingBook.cover : '';

        if (coverFile) {
            coverBase64 = await fileToBase64(coverFile);
        }

        const taskRows = document.querySelectorAll('#adminTasksContainer .task-input-group');
        const tasks = [];

        for (let row of taskRows) {
            const name = row.querySelector('.task-name').value.trim();
            const file = row.querySelector('.task-file').files[0];
            let imgBase64 = row.dataset.existingImage || '';

            if (file) {
                imgBase64 = await fileToBase64(file);
            }
            if (name) {
                tasks.push({ name, image: imgBase64 });
            }
        }

        const bookData = {
            classNum,
            subject,
            title,
            author,
            unitType,
            cover: coverBase64,
            tasks
        };

        if (editingId) {
            update(ref(db, `books/${editingId}`), bookData)
                .then(() => {
                    alert('Підручник оновлено!');
                    window.resetAdminForm();
                    renderAdminBooks();
                });
        } else {
            const newBookRef = push(ref(db, 'books'));
            set(newBookRef, bookData)
                .then(() => {
                    alert('Підручник збережено!');
                    window.resetAdminForm();
                    renderAdminBooks();
                });
        }
    });

    function renderAdminSubjects() {
        const cls = document.getElementById('adminSubjectClassSelect').value;
        const container = document.getElementById('adminSubjectsList');

        const defaultList = DEFAULT_SUBJECTS[cls] || [];
        const customList = customSubjects[cls] || [];
        const allSubjects = Array.from(new Set([...defaultList, ...customList]));

        if (allSubjects.length === 0) {
            container.innerHTML = '<p style="color:gray;">Немає предметів</p>';
            return;
        }

        let html = '';
        allSubjects.forEach(subj => {
            const isCustom = customList.includes(subj);
            html += `
                <div class="admin-item">
                    <div>
                        <strong>${subj}</strong> ${isCustom ? '<span style="font-size:10px; background:#3b82f6; color:white; padding:1px 4px; border-radius:3px;">доданий</span>' : ''}
                    </div>
                    <div class="admin-actions">
                        <button class="del-btn" onclick="window.adminDeleteSubject('${cls}', '${subj}')">Видалити предмет</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.adminAddSubject = function() {
        const cls = document.getElementById('adminSubjectClassSelect').value;
        const nameInput = document.getElementById('adminNewSubjectName');
        const subjName = nameInput.value.trim();

        if (subjName !== '') {
            const current = customSubjects[cls] || [];
            if (!current.includes(subjName)) {
                current.push(subjName);
                set(ref(db, `customSubjects/${cls}`), current).then(() => {
                    nameInput.value = '';
                    renderAdminSubjects();
                });
            }
        }
    }

    window.adminDeleteSubject = function(cls, subj) {
        if (confirm(`Видалити предмет "${subj}" для ${cls} класу та всі пов'язані підручники?`)) {
            if (customSubjects[cls]) {
                const updated = customSubjects[cls].filter(s => s !== subj);
                set(ref(db, `customSubjects/${cls}`), updated);
            }

            booksData.forEach(book => {
                if (Number(book.classNum) === Number(cls) && book.subject.toLowerCase() === subj.toLowerCase()) {
                    remove(ref(db, `books/${book.id}`));
                }
            });

            renderAdminSubjects();
        }
    }

    function renderAdminBooks() {
        const container = document.getElementById('adminBooksList');

        if (booksData.length === 0) {
            container.innerHTML = '<p style="color:gray;">Немає збережених підручників</p>';
            return;
        }

        let html = '';
        booksData.forEach(b => {
            html += `
                <div class="admin-item">
                    <div>
                        <strong>${b.title}</strong> (${b.classNum} кл — ${b.subject})
                    </div>
                    <div class="admin-actions">
                        <button class="edit-btn" onclick="window.editBook('${b.id}')">✏️ Редагувати</button>
                        <button class="del-btn" onclick="window.deleteBook('${b.id}')">✕ Видалити</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    window.editBook = function(id) {
        const book = booksData.find(b => b.id === id);
        if (!book) return;

        document.getElementById('editingBookId').value = book.id;
        document.getElementById('classSelect').value = book.classNum;
        document.getElementById('subjectInput').value = book.subject;
        document.getElementById('titleInput').value = book.title;
        document.getElementById('authorInput').value = book.author;
        document.getElementById('unitTypeSelect').value = book.unitType || 'Номер';

        document.getElementById('formHeader').innerText = '✏️ Редагувати підручник';
        document.getElementById('submitBookBtn').innerText = 'Зберегти зміни';
        document.getElementById('cancelEditBtn').style.display = 'block';

        if (book.cover) {
            document.getElementById('coverNotice').innerText = 'Обкладинка вже є (завантажте новий файл для заміни)';
        } else {
            document.getElementById('coverNotice').innerText = '';
        }

        const tasksContainer = document.getElementById('adminTasksContainer');
        tasksContainer.innerHTML = '';

        if (book.tasks && book.tasks.length > 0) {
            book.tasks.forEach(t => {
                window.addAdminTaskRow(t.name, t.image);
            });
        } else {
            window.addAdminTaskRow('1');
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.deleteBook = function(id) {
        if (confirm('Ви впевнені, що хочете видалити цей підручник?')) {
            remove(ref(db, `books/${id}`));
        }
    }

    document.getElementById('adminSubjectClassSelect').addEventListener('change', renderAdminSubjects);

    window.resetAdminForm();
    listenDatabase();
</script>

</body>
</html>
