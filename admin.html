<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель - ГДЗ.ua</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (v9+ compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        .admin-container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #0b3b6c;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .btn-submit {
            background: #0b3b6c;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #f8c300;
            color: #000;
        }
        .hidden { display: none; }
        .logout-btn {
            background: #d9534f;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>ГДЗ.ua - Панель адміністратора</h1>
    </header>

    <main class="container">
        <!-- Екран 1: Вхід у систему -->
        <div id="auth-block" class="admin-container">
            <h2>Авторизація</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email адміна:</label>
                    <input type="email" id="admin-email" required placeholder="admin@gdz.ua">
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="admin-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Увійти</button>
            </form>
            <p id="auth-error" style="color: red; margin-top: 10px; text-align: center;"></p>
        </div>

        <!-- Екран 2: Додавання рішень/вправ (доступний тільки після входу) -->
        <div id="admin-panel" class="admin-container hidden">
            <h2>Додати нове рішення / вправу</h2>
            <form id="add-solution-form">
                <div class="form-group">
                    <label>Клас:</label>
                    <select id="class-select">
                        <option value="9">9 клас</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Предмет:</label>
                    <input type="text" id="subject-name" value="Укр. мова" required>
                </div>
                <div class="form-group">
                    <label>Назва вправи (наприклад: Вправа 1-2):</label>
                    <input type="text" id="exercise-name" required placeholder="Вправа 1-2">
                </div>
                <div class="form-group">
                    <label>Посилання на зображення відповіді (URL):</label>
                    <input type="url" id="image-url" required placeholder="https://example.com/photo.jpg">
                </div>
                <button type="submit" class="btn-submit">Зберегти рішення</button>
            </form>

            <button class="btn-submit logout-btn" onclick="logout()">Вийти з акаунта</button>
        </div>
    </main>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyAmCzZAEKq4BMo6eWAN96IawhF95cH1sHM",
          authDomain: "keysbrawl-c4ae6.firebaseapp.com",
          databaseURL: "https://keysbrawl-c4ae6-default-rtdb.firebaseio.com",
          projectId: "keysbrawl-c4ae6",
          storageBucket: "keysbrawl-c4ae6.firebasestorage.app",
          messagingSenderId: "1090859079662",
          appId: "1:1090859079662:web:932bf6463cb0601083a0ff",
          measurementId: "G-PJR0BQBYVM"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Перевірка стану авторизації
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-block').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                document.getElementById('auth-block').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        // Вхід у систему
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    document.getElementById('auth-error').innerText = "Помилка входу: " + error.message;
                });
        });

        // Вихід із системи
        function logout() {
            auth.signOut();
        }

        // Збереження даних у Firebase Database
        document.getElementById('add-solution-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const exName = document.getElementById('exercise-name').value;
            const imgUrl = document.getElementById('image-url').value;
            const formattedKey = exName.replace(/\s+/g, '_');

            database.ref('solutions/' + formattedKey).set({
                exerciseName: exName,
                imageUrl: imgUrl
            }).then(() => {
                alert('Рішення успішно збережено!');
                document.getElementById('add-solution-form').reset();
            }).catch((err) => {
                alert('Помилка збереження: ' + err.message);
            });
        });
    </script>
</body>
</html>
