<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Адміністратора</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

    <header class="header admin-header">
        <div class="container header-container">
            <h1>⚙️ Панель Управління</h1>
            <a href="index.html" class="btn btn-secondary">← На головну</a>
        </div>
    </header>

    <main class="container">
        <section class="admin-panel">
            
            <!-- Доступність класів -->
            <div class="admin-block">
                <h2>1. Статус класів (1-11)</h2>
                <p class="section-desc">Поставити галочку = відкрити доступ до класу на сайті:</p>
                <div class="class-toggle-list" id="adminClassToggles">
                    <!-- Генерується через script.js -->
                </div>
            </div>

            <!-- Форма додавання / редагування вправ -->
            <div class="admin-block">
                <h2 id="formTitle">2. Додати вправу</h2>
                <form id="exerciseForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label for="classSelect">Клас:</label>
                        <select id="classSelect" required>
                            <!-- Генерується через script.js -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="exerciseTitle">Назва / Номер вправи:</label>
                        <input type="text" id="exerciseTitle" placeholder="Наприклад: Вправа 12, ст. 45" required>
                    </div>

                    <div class="form-group">
                        <label for="imagePath">Шлях до фото (GitHub URL або відносний шлях):</label>
                        <input type="text" id="imagePath" placeholder="img/class9/ex12.png або посилання з GitHub" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-success" id="saveBtn">Зберегти вправу</button>
                        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="resetForm()">Скасувати</button>
                    </div>
                </form>
            </div>

            <!-- Список вправ (CRUD) -->
            <div class="admin-block">
                <h2>3. База доданих вправ</h2>
                <div id="adminExercisesList" class="admin-exercises-list">
                    <!-- Генерується через script.js -->
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
