<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчальний портал / ГДЗ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <h1>Готові Домашні Завдання</h1>
            <a href="admin.html" class="btn btn-admin">Панель адміна ⚙️</a>
        </div>
    </header>

    <main class="container">
        <!-- Секція вибору класів (1-11) -->
        <section class="classes-section">
            <h2>Оберіть клас</h2>
            <div class="classes-grid" id="classesGrid">
                <!-- Генерується через script.js -->
            </div>
        </section>

        <!-- Секція перегляду вправ -->
        <section class="content-section" id="contentSection" style="display: none;">
            <h2 id="selectedClassTitle">Вправи</h2>
            <div class="exercises-list" id="exercisesList">
                <!-- Генерується через script.js -->
            </div>
        </section>
    </main>

    <!-- Модальне вікно для закритих класів -->
    <div id="classModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h3>Увага!</h3>
            <p id="modalMessage">Цей клас тимчасово недоступний.</p>
            <button onclick="closeModal()" class="btn btn-primary">Зрозуміло</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
